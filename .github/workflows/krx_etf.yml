# 저장 위치: .github/workflows/krx_etf.yml
# 필요한 Secrets (Settings > Secrets and variables > Actions):
#   KRX_ID, KRX_PW, SMTP_USER, SMTP_PASS   (선택: MAIL_TO)
name: KRX other ETF list

on:
  schedule:
    # GitHub cron은 UTC 기준. 21:20 UTC(일~목) = 06:20 KST(월~금)
    - cron: "20 21 * * 0-4"
  workflow_dispatch:   # Actions 탭에서 수동 실행

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          pip install playwright pandas openpyxl
          python -m playwright install --with-deps chromium

      - name: Run
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          OUT_DIR: output
        run: python krx_etf_all_ver2.0.py

      # 결과 엑셀 보관 (Actions 실행 화면에서 다운로드, 30일 보관)
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: other-etf-list
          path: output/*.xlsx
          retention-days: 30

      # 실패 시 로그인 화면 스크린샷/HTML 업로드 (원인 확인용)
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: debug
          path: output/debug/
          retention-days: 7
