# 필요한 Secrets: KRX_ID, KRX_PW, SMTP_USER, SMTP_PASS
name: KRX other ETF list

on:
  schedule:
    # GitHub cron은 UTC 기준. 21:20 UTC(일~목) = 06:20 KST(월~금)
    - cron: "20 21 * * 0-4"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          pip install playwright pandas openpyxl
          python -m playwright install --with-deps chromium

      - name: Run
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          OUT_DIR: output
        run: python krx_etf_all_ver2.0.py

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: other-etf-list
          path: output/*.xlsx
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: debug
          path: output/debug/
          retention-days: 7
